name: OpenBSD
on:
  push:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      - name: Build
        run: GOOS=openbsd GOARCH=amd64 go build

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ip.wtf-openbsd
          path: ip.wtf

  test:
    if: github.actor != 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ip.wtf-openbsd
          pattern: ip.wtf

      - name: Test
        env:
          TEST_HOST: ${{ secrets.TEST_HOST }}
          TEST_KEY: ${{ secrets.TEST_KEY }}
          TEST_PUB: ${{ secrets.TEST_PUB }}
        run: |
          mkdir -p ~/.ssh
          echo "${TEST_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${TEST_PUB}" > ~/.ssh/known_hosts

          set -exo pipefail
          remote="ip.wtf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          chmod +x ip.wtf
          scp ip.wtf "${TEST_HOST}:${remote}"
          ssh "${TEST_HOST}" bash -c "trap 'rm -f ${remote}' EXIT
            set -mbxeuo pipefail
            ./$remote -help
            ./$remote &
            sleep 2
            curl --json '' -s localhost:8080 | jq -r .ip
            curl -s --user-agent Mozilla/5.0 localhost:8080 | xmllint --html - | grep -A1 'IPv4<'
            kill %1
            fg || :" | tee out
          [[ $(grep -c 127.0.0.1 out) = 2 ]]
